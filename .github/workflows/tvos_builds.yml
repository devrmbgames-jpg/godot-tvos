name: tvOS Builds

on:
  push:
    branches: [feature/godot_3_tvos]
    paths:
      - "platform/tvos/**"
      - "misc/dist/tvos_xcode/**"
      - "drivers/**"
      - "core/**"
      - "modules/**"
      - "editor/editor_export.*"
      - "methods.py"
      - "SConstruct"
      - ".github/workflows/tvos_builds.yml"
      - ".github/actions/godot-build/**"
      - ".github/actions/godot-deps/**"
  workflow_dispatch:
    inputs:
      build_simulators:
        description: Also build simulator libraries, package tvos.zip and link Xcode projects
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Keep the SDK and compiler from the same installed Xcode.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  GODOT_BASE_BRANCH: 3.6-tvos-xcode26.3-v1

concurrency:
  group: tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: ${{ matrix.name }}
    # Intel runners can cross-compile arm64 and avoid the constrained ARM runner pool.
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple TV arm64 - Debug template
            target: release_debug
            library: libgodot.tvos.opt.debug.arm64.a
          - name: Apple TV arm64 - Release template
            target: release
            library: libgodot.tvos.opt.arm64.a

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          python-version: "3.12"

      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version

      - name: Validate build configuration
        run: python -m unittest discover -s platform/tvos/tests -p 'test_build_configuration.py'

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        continue-on-error: true
        with:
          cache-name: tvos-device-arm64-${{ matrix.target }}

      - name: Compile static export template
        id: build
        uses: ./.github/actions/godot-build
        with:
          platform: tvos
          target: ${{ matrix.target }}
          tools: false
          sconsflags: >-
            arch=arm64 simulator=no
            TVOSPATH="${{ env.DEVELOPER_DIR }}/Toolchains/XcodeDefault.xctoolchain"
            debug_symbols=no verbose=yes -j4 -k

      - name: Verify arm64 library and create checksum
        working-directory: bin
        env:
          LIBRARY: ${{ matrix.library }}
        run: |
          test -s "$LIBRARY"
          file "$LIBRARY"
          xcrun lipo -info "$LIBRARY"
          xcrun lipo -verify_arch arm64 "$LIBRARY"
          shasum -a 256 "$LIBRARY" > "$LIBRARY.sha256"

      - name: Upload static template
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: godot-tvos-${{ matrix.target }}-arm64
          path: |
            bin/${{ matrix.library }}
            bin/${{ matrix.library }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Write download link
        run: |
          printf '### Apple TV arm64 template\n\nFile: `%s`\n\n[Download artifact](%s)\n' \
            '${{ matrix.library }}' '${{ steps.upload.outputs.artifact-url }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Save Godot build cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: ./.github/actions/godot-cache-save
        continue-on-error: true
        with:
          cache-name: tvos-device-arm64-${{ matrix.target }}

  simulator:
    name: Simulator ${{ matrix.arch }} - Debug template
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_simulators }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          python-version: "3.12"

      - name: Compile simulator template
        uses: ./.github/actions/godot-build
        with:
          platform: tvos
          target: release_debug
          tools: false
          sconsflags: >-
            arch=${{ matrix.arch }} simulator=yes
            TVOSPATH="${{ env.DEVELOPER_DIR }}/Toolchains/XcodeDefault.xctoolchain"
            debug_symbols=no verbose=yes -j4 -k

      - name: Verify simulator library
        run: >-
          xcrun lipo -verify_arch ${{ matrix.arch }}
          bin/libgodot.tvos.opt.debug.${{ matrix.arch }}.simulator.a

      - name: Upload simulator library
        uses: actions/upload-artifact@v4
        with:
          name: godot-tvos-simulator-${{ matrix.arch }}
          path: bin/libgodot.tvos.opt.debug.${{ matrix.arch }}.simulator.a
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package and link Xcode projects
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_simulators }}
    needs: [template, simulator]
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: godot-tvos-*
          path: bin
          merge-multiple: true

      - name: Create XCFrameworks and export template
        run: >-
          python platform/tvos/build_template.py
          --debug bin/libgodot.tvos.opt.debug.arm64.a
          --release bin/libgodot.tvos.opt.arm64.a
          --debug-simulator bin/libgodot.tvos.opt.debug.arm64.simulator.a bin/libgodot.tvos.opt.debug.x86_64.simulator.a
          --output bin/tvos.zip
          --smoke-project bin/tvos-smoke

      - name: Link an unsigned tvOS application
        run: >-
          xcodebuild -project bin/tvos-smoke/TVOSSmoke.xcodeproj
          -scheme TVOSSmoke -configuration Debug
          -destination 'generic/platform=tvOS'
          -derivedDataPath bin/device-derived
          CODE_SIGNING_ALLOWED=NO build

      - name: Link an unsigned tvOS Simulator application
        run: >-
          xcodebuild -project bin/tvos-smoke/TVOSSmoke.xcodeproj
          -scheme TVOSSmoke -configuration Debug
          -destination 'generic/platform=tvOS Simulator'
          -derivedDataPath bin/simulator-derived
          CODE_SIGNING_ALLOWED=NO build

      - name: Upload export template
        uses: actions/upload-artifact@v4
        with:
          name: tvos-export-template
          path: bin/tvos.zip
          if-no-files-found: error
