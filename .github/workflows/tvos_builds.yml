name: tvOS Builds

on:
  push:
    branches: [feature/godot_3_tvos]
    paths:
      - "platform/tvos/**"
      - "misc/dist/tvos_xcode/**"
      - "drivers/**"
      - "core/**"
      - "modules/**"
      - "main/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "version.py"
      - "editor/editor_export.*"
      - "methods.py"
      - "SConstruct"
      - ".github/workflows/tvos_builds.yml"
      - ".github/actions/godot-build/**"
      - ".github/actions/godot-deps/**"
      - ".github/actions/godot-cache-restore/**"
      - ".github/actions/godot-cache-save/**"
  workflow_dispatch:
    inputs:
      build_simulators:
        description: Build complete XCFrameworks and tvos.zip, including both simulator architectures
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Keep the SDK and compiler from the same installed Xcode.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  GODOT_BASE_BRANCH: 3.6-tvos-xcode26.3-v1

concurrency:
  group: tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: ${{ matrix.name }}
    # Intel runners can cross-compile arm64 and avoid the constrained ARM runner pool.
    runs-on: macos-26-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple TV arm64 - Debug template
            target: release_debug
            library: libgodot.tvos.opt.debug.arm64.a
          - name: Apple TV arm64 - Release template
            target: release
            library: libgodot.tvos.opt.arm64.a

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          python-version: "3.12"

      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version

      - name: Validate build configuration
        run: python -m unittest discover -s platform/tvos/tests -p 'test_build_configuration.py'

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        continue-on-error: true
        with:
          cache-name: tvos-device-arm64-${{ matrix.target }}

      - name: Compile static export template
        id: build
        uses: ./.github/actions/godot-build
        with:
          platform: tvos
          target: ${{ matrix.target }}
          tools: false
          sconsflags: >-
            arch=arm64 simulator=no
            TVOSPATH="${{ env.DEVELOPER_DIR }}/Toolchains/XcodeDefault.xctoolchain"
            debug_symbols=no verbose=yes -j4 -k

      - name: Verify arm64 library and create checksum
        working-directory: bin
        env:
          LIBRARY: ${{ matrix.library }}
        run: |
          test -s "$LIBRARY"
          file "$LIBRARY"
          xcrun lipo -info "$LIBRARY"
          xcrun lipo "$LIBRARY" -verify_arch arm64
          shasum -a 256 "$LIBRARY" > "$LIBRARY.sha256"

      - name: Upload static template
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: godot-tvos-${{ matrix.target }}-arm64
          path: |
            bin/${{ matrix.library }}
            bin/${{ matrix.library }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Write download link
        run: |
          printf '### Apple TV arm64 template\n\nFile: `%s`\n\n[Download artifact](%s)\n' \
            '${{ matrix.library }}' '${{ steps.upload.outputs.artifact-url }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Save Godot build cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: ./.github/actions/godot-cache-save
        continue-on-error: true
        with:
          cache-name: tvos-device-arm64-${{ matrix.target }}

  simulator:
    name: Simulator ${{ matrix.arch }} - ${{ matrix.config.name }} template
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_simulators }}
    runs-on: macos-26-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        config:
          - name: Debug
            target: release_debug
            suffix: opt.debug
          - name: Release
            target: release
            suffix: opt
    env:
      LIBRARY: libgodot.tvos.${{ matrix.config.suffix }}.${{ matrix.arch }}.simulator.a
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          python-version: "3.12"

      - name: Report Apple simulator toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvsimulator --show-sdk-version

      - name: Restore simulator build cache
        uses: ./.github/actions/godot-cache-restore
        continue-on-error: true
        with:
          cache-name: tvos-simulator-${{ matrix.arch }}-${{ matrix.config.target }}

      - name: Compile simulator template
        id: build
        uses: ./.github/actions/godot-build
        with:
          platform: tvos
          target: ${{ matrix.config.target }}
          tools: false
          sconsflags: >-
            arch=${{ matrix.arch }} simulator=yes
            TVOSPATH="${{ env.DEVELOPER_DIR }}/Toolchains/XcodeDefault.xctoolchain"
            debug_symbols=no verbose=yes -j4 -k

      - name: Verify simulator library and create checksum
        working-directory: bin
        run: |
          test -s "$LIBRARY"
          file "$LIBRARY"
          xcrun lipo -info "$LIBRARY"
          xcrun lipo "$LIBRARY" -verify_arch ${{ matrix.arch }}
          shasum -a 256 "$LIBRARY" > "$LIBRARY.sha256"

      - name: Upload simulator library
        uses: actions/upload-artifact@v4
        with:
          name: godot-tvos-simulator-${{ matrix.config.target }}-${{ matrix.arch }}
          path: |
            bin/${{ env.LIBRARY }}
            bin/${{ env.LIBRARY }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Save simulator build cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: ./.github/actions/godot-cache-save
        continue-on-error: true
        with:
          cache-name: tvos-simulator-${{ matrix.arch }}-${{ matrix.config.target }}

  package:
    name: Package XCFrameworks and link all variants
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_simulators }}
    needs: [template, simulator]
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate XCFramework packaging
        run: python -m unittest discover -s platform/tvos/tests -p 'test_build_template.py'

      - name: Download device libraries
        uses: actions/download-artifact@v4
        with:
          pattern: godot-tvos-release*-arm64
          path: bin
          merge-multiple: true

      - name: Download simulator libraries
        uses: actions/download-artifact@v4
        with:
          pattern: godot-tvos-simulator-*
          path: bin
          merge-multiple: true

      - name: Verify downloaded libraries
        working-directory: bin
        run: shasum -a 256 -c ./*.sha256

      - name: Create XCFrameworks and export template
        run: >-
          python platform/tvos/build_template.py
          --debug bin/libgodot.tvos.opt.debug.arm64.a
          --release bin/libgodot.tvos.opt.arm64.a
          --debug-simulator bin/libgodot.tvos.opt.debug.arm64.simulator.a bin/libgodot.tvos.opt.debug.x86_64.simulator.a
          --release-simulator bin/libgodot.tvos.opt.arm64.simulator.a bin/libgodot.tvos.opt.x86_64.simulator.a
          --frameworks-output bin/xcframeworks
          --output bin/tvos.zip
          --smoke-projects bin/tvos-smoke

      - name: Link Debug and Release Apple TV applications
        run: |
          mkdir -p bin/link-logs
          for variant in debug release; do
            if [ "$variant" = debug ]; then configuration=Debug; else configuration=Release; fi
            xcodebuild -project "bin/tvos-smoke/$variant/TVOSSmoke.xcodeproj" \
              -scheme TVOSSmoke -configuration "$configuration" \
              -sdk appletvos -destination 'generic/platform=tvOS' \
              -derivedDataPath "bin/derived-$variant-device" \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS= CODE_SIGNING_ALLOWED=NO build \
              2>&1 | tee "bin/link-logs/$variant-device-arm64.log"
          done

      - name: Link both configurations and architectures of tvOS Simulator applications
        run: |
          for variant in debug release; do
            if [ "$variant" = debug ]; then configuration=Debug; else configuration=Release; fi
            for arch in arm64 x86_64; do
              xcodebuild -project "bin/tvos-smoke/$variant/TVOSSmoke.xcodeproj" \
                -scheme TVOSSmoke -configuration "$configuration" \
                -sdk appletvsimulator -destination 'generic/platform=tvOS Simulator' \
                -derivedDataPath "bin/derived-$variant-simulator-$arch" \
                "ARCHS=$arch" ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS= CODE_SIGNING_ALLOWED=NO build \
                2>&1 | tee "bin/link-logs/$variant-simulator-$arch.log"
            done
          done

      - name: Create distribution checksums
        run: |
          python - <<'PYTHON'
          import hashlib
          from pathlib import Path

          root = Path("bin/xcframeworks")
          checksums = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  with path.open("rb") as stream:
                      digest = hashlib.file_digest(stream, "sha256").hexdigest()
                  checksums.append(f"{digest}  {path.relative_to(root).as_posix()}\n")
          (root / "SHA256SUMS").write_text("".join(checksums))
          PYTHON
          cd bin
          shasum -a 256 tvos.zip > tvos.zip.sha256

      - name: Upload XCFrameworks
        id: xcframeworks
        uses: actions/upload-artifact@v4
        with:
          name: godot-tvos-xcframeworks
          path: bin/xcframeworks/
          if-no-files-found: error
          retention-days: 30

      - name: Upload export template
        id: export-template
        uses: actions/upload-artifact@v4
        with:
          name: tvos-export-template
          path: |
            bin/tvos.zip
            bin/tvos.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Write download links
        env:
          XCFRAMEWORKS_URL: ${{ steps.xcframeworks.outputs.artifact-url }}
          EXPORT_TEMPLATE_URL: ${{ steps.export-template.outputs.artifact-url }}
        run: |
          printf '### Godot tvOS XCFrameworks\n\nDebug and Release: Apple TV arm64 + Simulator arm64/x86_64.\n\nAll six configurations passed unsigned Xcode application linking.\n\n[Download XCFrameworks](%s)\n\n[Download tvos.zip export template](%s)\n' \
            "$XCFRAMEWORKS_URL" "$EXPORT_TEMPLATE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed link diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-tvos-xcode-link-logs
          path: bin/link-logs/
          if-no-files-found: ignore
          retention-days: 14
